<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo List App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>📝 My Todo List</h1>
            <p class="subtitle">Stay organized and productive</p>
        </header>

        <div class="input-section">
            <div class="input-group">
                <input 
                    type="text" 
                    id="todoInput" 
                    placeholder="Add a new task..." 
                    autocomplete="off"
                />
                <button id="addBtn" class="btn btn-primary">Add Task</button>
            </div>
            <div class="filter-buttons">
                <button class="filter-btn active" data-filter="all">All</button>
                <button class="filter-btn" data-filter="active">Active</button>
                <button class="filter-btn" data-filter="completed">Completed</button>
            </div>
        </div>

        <div class="stats">
            <div class="stat">
                <span class="stat-label">Total:</span>
                <span id="totalCount" class="stat-value">0</span>
            </div>
            <div class="stat">
                <span class="stat-label">Active:</span>
                <span id="activeCount" class="stat-value">0</span>
            </div>
            <div class="stat">
                <span class="stat-label">Completed:</span>
                <span id="completedCount" class="stat-value">0</span>
            </div>
        </div>

        <ul id="todoList" class="todo-list">
            <!-- Todos will be inserted here -->
        </ul>

        <div class="empty-state" id="emptyState">
            <p>🎉 No tasks! Time to relax or add a new one.</p>
        </div>

        <div class="actions">
            <button id="clearCompletedBtn" class="btn btn-secondary">Clear Completed</button>
            <button id="clearAllBtn" class="btn btn-danger">Clear All</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
